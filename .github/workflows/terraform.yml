name: Terraform

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.hcl"
      - "src/**"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run against dev (needs the AWS secrets)"
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

env:
  TF_VERSION: "1.17.1"
  AWS_REGION: "eu-central-1"
  ENVIRONMENT: "dev"

jobs:
  validate:
    name: Validate (fmt + validate + tflint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: TFLint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init
          tflint --recursive

  test:
    name: Test (pytest + moto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run handler tests
        run: pytest

  plan:
    name: Plan (manual dispatch)
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'plan'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: |
          # The example holds key, region and lock table; the bucket comes from a secret.
          grep -v '^bucket' environments/${{ env.ENVIRONMENT }}/backend.hcl.example > "$RUNNER_TEMP/backend.hcl"
          terraform init \
            -backend-config="$RUNNER_TEMP/backend.hcl" \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Terraform plan
        run: terraform plan -var-file=environments/${{ env.ENVIRONMENT }}/terraform.tfvars

  apply:
    name: Apply (manual dispatch)
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: |
          # The example holds key, region and lock table; the bucket comes from a secret.
          grep -v '^bucket' environments/${{ env.ENVIRONMENT }}/backend.hcl.example > "$RUNNER_TEMP/backend.hcl"
          terraform init \
            -backend-config="$RUNNER_TEMP/backend.hcl" \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Terraform apply
        run: terraform apply -auto-approve -var-file=environments/${{ env.ENVIRONMENT }}/terraform.tfvars
